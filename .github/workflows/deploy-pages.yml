name: Deploy to GitHub Pages

# master への push で GitHub Pages へ公開。手動実行も可能。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 計算ロジックのテスト。落ちたらデプロイしない。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: アイコンが最新か（tools/make-icons.mjs の出力と一致するか）
        run: |
          npm run icons
          if ! git diff --quiet -- icons; then
            echo "::error::icons/ がソースと一致しません。'npm run icons' を実行してコミットしてください。"
            git diff --stat -- icons
            exit 1
          fi

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (PWA一式を公開)
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          touch _site/.nojekyll
          ls -R _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
