name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに制限（実行中に新しい push があれば終わらせてから次へ）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (構文チェック用)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 構文チェック
        run: |
          for f in js/*.js service-worker.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: 配信用ディレクトリを準備（不要ファイルを除外）
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest service-worker.js css js *.png _site/
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
